<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0f" />
<meta name="build-version" content="dev" />
<title>Orbit Weather</title>
<meta name="description" content="一個答案的天氣：紫外線、降雨、空氣品質，和你釘選的地點。" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Weather" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="application-name" content="Orbit Weather" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="preconnect" href="https://orbit-workers-proxy.pengzjay.workers.dev" crossorigin />
<link rel="stylesheet" href="./quadra.css" />
<link rel="stylesheet" href="./weather.css" />
</head>
<body>
<div id="loading" data-title="Orbit Weather" data-cache="orbit-weather-"></div>
<script src="./boot.js"></script>
<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34" />
      <div class="q-brand-text">
        <h1 id="title">Orbit Weather</h1>
        <p id="status" class="q-status" aria-live="polite"></p>
      </div>
    </div>
    <div id="top-actions" class="q-actions"></div>
  </div>
  <nav id="dots" class="q-chips wx-dots" aria-label="地點"></nav>
</header>
<main id="pager" class="wx-pager"></main>
<script type="module" src="./app.mjs" onerror="window.__fxFail()"></script>

</html>
