<!-- kit:head: where the app's stylesheets end, before any module. The kit
     comes from one place for every app (Shared-Proxy's GitHub Pages, same
     site as the apps), at the version this device last saw (quadra.kit, set
     by the kit's watchUpdates), so a change to the kit is one push to
     Shared-Proxy and every app has it the next time it's opened. -->
<script>!function(b,v,q,m,f,i){try{v=localStorage.getItem('quadra.kit')||''}catch(e){v=''}q=v?'?v='+encodeURIComponent(v):'';m={'#kit/':b};f=['quadra.mjs','logos.mjs','names.mjs','photos.mjs','catalog.mjs'];for(i=0;i<f.length;i++)m['#kit/'+f[i]]=b+f[i]+q;window.QUADRA_KIT={base:b,version:v,url:function(x){return b+x+q}};document.write('<script type="import'+'map">'+JSON.stringify({imports:m})+'<\/script><link rel="stylesheet" href="'+b+'quadra.css'+q+'"><link rel="modulepreload" href="'+b+'quadra.mjs'+q+'">')}('../Shared-Proxy/kit/')</script>
<!-- /kit:head -->
<link rel="stylesheet" href="./weather.css" />
</head>
<body>
<div id="loading" data-title="Orbit Weather" data-cache="orbit-weather-"></div>
<!-- kit:boot: right after <div id="loading">. -->
<script>document.write('<script src="'+QUADRA_KIT.url('boot.js')+'"><\/script>')</script>
<!-- /kit:boot -->

      </div>
    </div>
    <div id="top-actions" class="q-actions"></div>
  </div>
  <nav id="dots" class="q-chips wx-dots" aria-label="地點"></nav>
</header>
<main id="pager" class="wx-pager"></main>
<script type="module" src="./app.mjs" onerror="window.__fxFail()"></script>
</body>
